<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel del administrador · Helena les dice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .quick { display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--line); color: var(--text); text-decoration: none; transition: border-color .15s, box-shadow .15s, transform .15s; }
    .quick svg { color: var(--green-dark); }
    .quick:hover { border-color: var(--green); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
    .quick__title { font-size: 16px; font-weight: 800; }
    .quick__text { color: var(--text-2); }
    .quick--primary { background: var(--green); border-color: var(--green); color: #fff; }
    .quick--primary svg, .quick--primary .quick__text { color: #fff; opacity: .95; }
    .quick--primary:hover { background: var(--green-dark); border-color: var(--green-dark); color: #fff; }
    .dist-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line-soft); }
    .dist-dot { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  </style>
</head>
<body>
  <div class="app-body"><main id="main" class="main"><div class="page-loading"><span class="spinner" aria-label="Cargando"></span></div></main></div>
  <script type="module" src="/js/pages/admin-panel.js"></script>
</body>
</html>
