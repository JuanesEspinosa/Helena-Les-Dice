<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de seguimiento · Helena les dice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .filters .select { width: auto; min-width: 170px; font-weight: 600; }
    .team-card { padding: 20px; display: flex; flex-direction: column; gap: 14px; transition: box-shadow .15s, border-color .15s; }
    .team-card:hover { border-color: #C5D2CC; box-shadow: var(--shadow); }
    .team-card--quiet { border-style: dashed; }
    .team-card__pct { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .sub-label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; color: #3E4A45; }
    .lv-bars { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; }
    .lv-bar { height: 10px; border-radius: 3px; background: #E3E8E6; overflow: hidden; }
    .lv-bar > span { display: block; height: 100%; background: #4FAF77; }
    .lv-bar--done > span { background: var(--green); }
    .part { display: grid; grid-template-columns: minmax(80px, 130px) minmax(0, 1fr) 44px; align-items: center; gap: 10px; }
    .part__name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .part__pct { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
    .part--low .part__name, .part--low .part__pct { color: var(--warn); }
    .card-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
    .pill-warn { background: var(--warn-bg); color: var(--warn); }
    .review-link { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 12px; background: #F4F8FF; color: var(--text); text-decoration: none; transition: background .15s; }
    .review-link:hover, .review-link:focus-visible { background: var(--st-review-bg); color: var(--text); }
    .alerts-card { background: #FFF8E6; border-color: #F1D9A0; }
    .refresh-note { font-size: 13px; color: var(--text-3); }
    .stat__value--back { color: var(--st-back); }
    .stat__value--review { color: var(--st-review); }
  </style>
</head>
<body>
  <div class="app-body"><main id="main" class="main"><div class="page-loading"><span class="spinner" aria-label="Cargando"></span></div></main></div>
  <script type="module" src="/js/pages/docente-panel.js"></script>
</body>
</html>
