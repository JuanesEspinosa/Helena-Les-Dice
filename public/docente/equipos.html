<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipos · Helena les dice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .avatars { display: flex; align-items: center; }
    .avatars .avatar { margin-right: -6px; border: 2px solid var(--surface); }
    .avatars__count { margin-left: 14px; color: #3E4A45; font-weight: 600; white-space: nowrap; }
    .form-card { padding: 20px; display: flex; flex-direction: column; gap: 14px; scroll-margin-top: calc(var(--header-h) + 16px); }
    .form-card--edit { border: 2px solid var(--green); }
    .results { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius-sm); max-height: 260px; overflow-y: auto; }
    .result { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-top: 1px solid var(--line-soft); }
    .result:first-child { border-top: 0; }
    .result__text { flex: 1; min-width: 0; }
    .result__text span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 4px 4px 12px; border-radius: 999px; background: var(--green-soft); color: var(--green-dark); font-weight: 700; }
    .chip button { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: inherit; cursor: pointer; display: grid; place-items: center; }
    .chip button:hover { background: rgba(0, 106, 44, .12); }
    .chip--new { background: #E3EEFF; color: var(--st-review); }
    .filters .select { width: auto; min-width: 160px; }
  </style>
</head>
<body>
  <div class="app-body"><main id="main" class="main"><div class="page-loading"><span class="spinner" aria-label="Cargando"></span></div></main></div>
  <script type="module" src="/js/pages/docente-equipos.js"></script>
</body>
</html>
